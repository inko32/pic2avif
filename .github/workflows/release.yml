name: Release

# Runs whenever you push a tag like "v1.0.0". To cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

# Lets the release job create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""

          # Windows
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"

          # macOS - built natively on real Mac runners, NOT cross-compiled,
          # because timestamp_darwin.go uses cgo (setattrlist) to preserve
          # creation time. Cross-compiling from Linux/Windows would fail
          # here, so each Mac architecture gets its own native runner.
          - runner: macos-13 # Intel
            goos: darwin
            goarch: amd64
            ext: ""
          - runner: macos-latest # Apple Silicon
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/pic2avif-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pic2avif-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
