name: CI

# Sanity-checks every push and PR by building on all three platforms.
# This does NOT publish anything - see release.yml for that.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & vet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...
